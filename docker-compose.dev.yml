services:
    web:
        build: .
        environment:
            FLASK_DEBUG: 1
        command: flask run --host 0.0.0.0
        volumes:
            - ./pd3f/:/app/
            - ./data/pd3f-data-uploads/:/uploads/
    ocr_worker:
        build: ./pd3f-ocr
    worker:
        volumes:
            - ./pd3f/:/app/
            - to_ocr:/to-ocr/
            - ./data/pd3f-data-uploads/:/uploads/
