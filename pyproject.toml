[project]
name = "pd3f"
version = "1.0.0"
description = "Extract the continuous text of PDFs: paragraphs, hyphens, running headers and footers, footnotes, OCR"
license = "AGPL-3.0-only"
authors = [{ name = "Johannes Filter", email = "hi@jfilter.de" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["pdf", "nlp", "german", "text-extraction", "ocr", "dehyphenation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
]
dependencies = [
    "dehyphen>=0.6.0,<0.7",
    "liteparse>=2.17,<3",
    "ocrmypdf>=17,<18",
    "pillow>=12",
]

[project.optional-dependencies]
web = ["flask>=3.1", "gunicorn>=23"]

[project.scripts]
pd3f = "pd3f.cli:main"

[project.urls]
Repository = "https://github.com/pd3f/pd3f"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "flask>=3.1",
    "playwright>=1.64",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pd3f"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
